<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Standard favicons -->
    <link rel="icon" type="image/png" sizes="16x16" href="https://raw.githubusercontent.com/Tomask4/tomask4.github.io/refs/heads/main/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="https://raw.githubusercontent.com/Tomask4/tomask4.github.io/refs/heads/main/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="https://raw.githubusercontent.com/Tomask4/tomask4.github.io/refs/heads/main/favicon-48x48.png">

    <!-- Apple Touch Icon (iOS) -->
    <link rel="apple-touch-icon" sizes="180x180" href="https://raw.githubusercontent.com/Tomask4/tomask4.github.io/refs/heads/main/apple-touch-icon.png">

    <!-- Android Chrome -->
    <link rel="icon" type="image/png" sizes="192x192" href="https://raw.githubusercontent.com/Tomask4/tomask4.github.io/refs/heads/main/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="https://raw.githubusercontent.com/Tomask4/tomask4.github.io/refs/heads/main/android-chrome-512x512.png">

    <!-- Standaard fallback -->
    <link rel="shortcut icon" href="https://raw.githubusercontent.com/Tomask4/tomask4.github.io/refs/heads/main/favicon-32x32.png">

    <!-- Web App Manifest (optioneel) -->
    <link rel="manifest" href="https://raw.githubusercontent.com/Tomask4/tomask4.github.io/refs/heads/main/site.webmanifest">

    <!-- Microsoft Tiles (optioneel) -->
    <meta name="msapplication-TileImage" content="https://raw.githubusercontent.com/Tomask4/tomask4.github.io/refs/heads/main/android-chrome-512x512.png">
    <meta name="msapplication-TileColor" content="#ffffff">
    <meta name="theme-color" content="#ffffff">
    <title>Portfolio - Tomask4</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #141824;
            --bg-card: #1a1f2e;
            --accent: #3b82f6;
            --accent-light: #60a5fa;
            --text-primary: #e5e7eb;
            --text-secondary: #9ca3af;
            --border: #2d3548;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(10, 14, 23, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            z-index: 1000;
            padding: 1rem 0;
        }

        .nav-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.3s;
            font-weight: 500;
        }

        .nav-links a:hover {
            color: var(--text-primary);
        }

        .lang-toggle {
            background: transparent;
            border: 2px solid var(--border);
            color: var(--text-secondary);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .lang-toggle:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Hero Section */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 2rem;
        }

        .hero-content {
            max-width: 800px;
            text-align: center;
            z-index: 1;
        }

        .profile-image {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 1.5rem;
            border: 3px solid var(--accent);
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.3);
        }

        .hero h1 {
            font-size: clamp(2.5rem, 8vw, 5rem);
            font-weight: 800;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--text-primary), var(--accent-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero p {
            font-size: clamp(1.1rem, 2vw, 1.4rem);
            color: var(--text-secondary);
            margin-bottom: 2.5rem;
            line-height: 1.8;
        }

        .cta-button {
            display: inline-block;
            padding: 1rem 2.5rem;
            background: var(--accent);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .cta-button:hover {
            background: transparent;
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-2px);
        }

        /* Background Animation */
        .bg-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: 0.3;
            mask-image: radial-gradient(circle at center, black, transparent 70%);
        }

        /* Projects Section */
        .projects-section {
            min-height: 100vh;
            padding: 6rem 2rem 4rem;
            background: var(--bg-secondary);
        }

        .section-header {
            max-width: 1200px;
            margin: 0 auto 3rem;
            text-align: center;
        }

        .section-header h2 {
            font-size: clamp(2rem, 5vw, 3rem);
            margin-bottom: 1rem;
        }

        .section-header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        /* Project Grid */
        .projects-grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 2rem;
        }

        .project-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .project-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--accent), var(--accent-light));
            transform: scaleX(0);
            transition: transform 0.3s;
        }

        .project-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
        }

        .project-card:hover::before {
            transform: scaleX(1);
        }

        .project-header {
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .project-favicon {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            flex-shrink: 0;
            object-fit: cover;
        }

        .project-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin: 0;
        }

        .project-description {
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }

        .project-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .tag {
            padding: 0.25rem 0.75rem;
            background: rgba(59, 130, 246, 0.1);
            color: var(--accent-light);
            border-radius: 6px;
            font-size: 0.85rem;
            border: 1px solid rgba(59, 130, 246, 0.2);
        }

        .project-links {
            display: flex;
            gap: 1rem;
        }

        .project-link {
            flex: 1;
            padding: 0.75rem;
            text-align: center;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .link-github {
            background: transparent;
            border: 2px solid var(--border);
            color: var(--text-primary);
        }

        .link-github:hover {
            border-color: var(--text-primary);
            background: rgba(255, 255, 255, 0.05);
        }

        .link-demo {
            background: var(--accent);
            color: white;
            border: 2px solid transparent;
        }

        .link-demo:hover {
            background: transparent;
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Footer */
        footer {
            padding: 3rem 2rem;
            text-align: center;
            background: var(--bg-primary);
            border-top: 1px solid var(--border);
            color: var(--text-secondary);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .nav-links {
                gap: 1rem;
            }

            .projects-grid {
                grid-template-columns: 1fr;
            }

            .hero {
                padding-top: 6rem;
            }
        }

        /* Smooth Scroll */
        html {
            scroll-behavior: smooth;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav>
        <div class="nav-content">
            <div class="logo">Tomask4</div>
            <ul class="nav-links">
                <li><a href="#home" data-lang-key="nav.home">Home</a></li>
                <li><a href="#projects" data-lang-key="nav.projects">Projects</a></li>
                <li><button class="lang-toggle" id="langToggle">NL</button></li>
            </ul>
        </div>
    </nav>

    <!-- Hero Section -->
    <section id="home" class="hero">
        <div class="bg-grid"></div>
        <div class="hero-content">
            <img src="https://raw.githubusercontent.com/Tomask4/tomask4.github.io/refs/heads/main/Logo.png" alt="Tomask4" class="profile-image">
            <h1 data-lang-key="hero.title">Tomask4</h1>
            <p data-lang-key="hero.description">I build web applications, tools and experiments. From practical developer utilities to creative side projects</p>
            <a href="#projects" class="cta-button" data-lang-key="hero.cta">View Projects</a>
        </div>
    </section>

    <!-- Projects Section -->
    <section id="projects" class="projects-section">
        <div class="section-header">
            <h2 data-lang-key="projects.title">Projects</h2>
            <p data-lang-key="projects.subtitle">A collection of projects I've worked on</p>
        </div>
        <div class="projects-grid" id="projectsContainer"></div>
    </section>

    <!-- Footer -->
    <footer>
        <p data-lang-key="footer.text">© 2026 Tomask4</p>
    </footer>
    <feedback-widget></feedback-widget>
    <script src="https://gist.githack.com/Tomask4/15b3baa4426559822ebb0212bb7f8a78/raw/feedback-widget.js"></script>

    <script>
        // Language translations
        const translations = {

                'hero.cta': 'View Projects',
                'projects.title': 'Projects',
                'projects.subtitle': 'A collection of projects I\'ve worked on',

            nl: {
                'nav.home': 'Home',
                'nav.projects': 'Projecten',
                'hero.title': 'Tomask4',
                'hero.description': 'Ik bouw webapplicaties, tools en experimenten. Van praktische developer utilities tot creatieve side projects.',
                'hero.cta': 'Bekijk Projecten',
                'projects.title': 'Projecten',
                'projects.subtitle': 'Een collectie van projecten waar ik aan heb gewerkt',
                'footer.text': '© 2026 Tomask4'
            }
        };

        const projects = [
            {

                    nl: "Een encryptietool waarmee je tekst kunt versleutelen en ontsleutelen met verschillende algoritmen."
                },

            },
            {

                description: {
                    en: "A collection of developer tools including a JSON formatter, Regex tester and more.",
                    nl: "Een verzameling ontwikkelaarshulpmiddelen inclusief JSON formatter, Regex tester en meer."
                },
                tags: ["HTML", "CSS", "JavaScript"],
                github: "https://github.com/Tomask4/devtools",
                demo: "https://tomask4.github.io/devtools/"
            },
            {
                name: "ChatDPT [fake]",
                description: {
                    en: "A simple chat interface that simulates a conversation with an AI.",
                    nl: "Een eenvoudige chatinterface die een gesprek met een AI simuleert."
                },
                tags: ["HTML", "CSS", "JavaScript"],
                github: "https://github.com/Tomask4/ChatDPT-fake-",
                demo: "https://tomask4.github.io/ChatDPT-fake-/"
            },
            {
                name: "SkipSite",
                description: {
                    en: "A fun game where you have to skip ads by doing various tasks.",
                    nl: "Een leuk spel waarbij je advertenties moet overslaan door verschillende taken uit te voeren."
                },
                tags: ["HTML", "CSS", "Javascript"],
                github: "https://github.com/Tomask4/skipsite",
                demo: "https://tomask4.github.io/skipsite/"
            },
            {
                name: "Ugliest site",
                description: {
                    en: "A project that showcases the ugliest website design possible, just for fun!",
                    nl: "Een project dat het lelijkste websiteontwerp toont dat mogelijk is, gewoon voor de lol!"
                },
                tags: ["HTML", "CSS", "JavaScript"],
                github: "https://github.com/Tomask4/Lelijkste-site",
                demo: "https://tomask4.github.io/Lelijkste-site/"
            },
            {
                name: "Time PopUp",
                description: {
                    en: "A simple JavaScript project that shows a popup with the current time.",
                    nl: "Een eenvoudig JavaScript-project dat een popup toont met de huidige tijd."
                },
                tags: ["HTML", "CSS", "JavaScript"],
                github: "https://github.com/Tomask4/time",
                demo: "https://tomask4.github.io/time/"
            },
            {
                name: "Kahoot Flooder",
                description: {
                    en: "A tool that allows you to flood a Kahoot game with fake players.",
                    nl: "Een tool waarmee je een Kahoot-spel kunt overspoelen met nepspelers."
                },
                tags: ["HTML", "CSS", "JavaScript", "Node.js", "Kahoot API"],
                github: "https://github.com/Tomask4/kahoot-flooder",
                demo: "https://kahoot-flooder-t7h4.onrender.com/"
            },
            {
                name: "Scoreboard",
                description: {
                    en: "A simple scoreboard application that allows you to keep track of scores in a game.",
                    nl: "Een eenvoudige scorebord-applicatie waarmee je scores in een spel kunt bijhouden."
                },
                tags: ["HTML", "CSS", "JavaScript"],
                github: "https://github.com/Tomask4/scoreboard",
                demo: "https://tomask4.github.io/scoreboard/"
            },
            {
                name: "Password Game",
                description: {
                    en: "A recreation of the neal.fun password game where you have to create a password that needs to meet a lot of rules",
                    nl: "Een recreatie van de neal.fun wachtwoord game waar je een wachtwoord moet maken dat moet voldoen aan veel regels"
                },
                tags: ["HTML", "CSS", "JavaScript"],
                github: "https://github.com/Tomask4/Password-Game",
                demo: "https://tomask4.github.io/Password-Game/"
            },
            {
                name: "ShortURL",
                description: {
                    en: "A site where you can generate a url that redirects to a url you enter and you can see the traffic there",
                    nl: "Een website waar je een link kan genereren die redirect naar jouw link en je dan het verkeer kan zien"
                },
                tags: ["HTML", "CSS", "JavaScript", "Firebase"],
                github: "https://github.com/Tomask4/shorturl",
                demo: "https://tomask4.github.io/shorturl/"
            },
            {
                name: "AuthSite",
                description: {
                    en: "A simple website where the admin can make keys and the user can check if the keys are valid",
                    nl: "Een simplele website waar de admin sleutels kan maken en de user kan kijken of ze geldig zijn"
                },
                tags: ["HTML", "CSS", "JavaScript", "Firebase"],
                github: "https://github.com/Tomask4/AuthSite",
                demo: "https://tomask4.github.io/AuthSite/"
            },
            {
                name: "The List",
                description: {
                    en: "A website where everyone can add items to 'The list'",
                    nl: "Een website waar iedereen items kan toevoegen aan 'De lijst'"
                },
                tags: ["HTML", "CSS", "JavaScript", "Firebase"],
                github: "https://github.com/Tomask4/thelist",
                demo: "https://tomask4.github.io/thelist/"
            },
            {
                name: "Klasplattegrond",
                description: {
                    en: "A website where you can make mappings for where students should sit in the classroom",
                    nl: "Een website waar je plattegronden kunt maken voor waar leerlingen moeten zitten in de klas"
                },
                tags: ["HTML", "CSS", "JavaScript", "Firebase"],
                github: "https://github.com/Tomask4/klasplattegrond",
                demo: "https://tomask4.github.io/klasplattegrond/"
            },
            {
                name: "Palette Generator",
                description: {
                    en: "A full-screen tool to generate color palettes and fonts with a live website preview mode",
                    nl: "Een schermvullende tool om kleurenpaletten en fonts te genereren inclusief een live website preview-modus"
                },
                tags: ["HTML", "CSS", "JavaScript", "Google Fonts API"],
                github: "https://github.com/Tomask4/PaletteGenerator/",
                demo: "https://tomask4.github.io/PaletteGenerator/"
            },
            {
                name: "Multi-Tool Dashboard",
                description: {
                    en: "A modern full-screen multi-tool dashboard with Firebase Google authentication, featuring a ToDo app, converters, code beautifiers, themes, and curated developer links",
                    nl: "Een modern schermvullend multi-tool dashboard met Firebase Google-authenticatie, inclusief een ToDo-app, converters, code beautifiers, thema's en handige developer-links"
                },
                tags: [
                    "HTML",
                    "CSS",
                    "JavaScript",
                    "Firebase"
                ],
                demo: "https://toolbox-a7d0d.web.app/"
            },
            {
                name: "Template Studio",
                description: {
                    en: "An interactive HTML/CSS/JS component gallery with 30+ ready-to-use templates and a live theme customizer that automatically adapts your copied code to your chosen colors and fonts",
                    nl: "Een interactieve HTML/CSS/JS component gallery met 30+ kant-en-klare templates en een live theme customizer die automatisch je gekopieerde code aanpast aan jouw gekozen kleuren en fonts"
                },
                tags: [
                    "HTML",
                    "CSS",
                    "JavaScript"
                ],
                github: "https://github.com/Tomask4/TemplateStudio/",
                demo: "https://tomask4.github.io/TemplateStudio/"
            }
        ];

        // Reverse the projects array
        const reversedProjects = [...projects].reverse();

        // Current language (default English)
        let currentLang = 'en';

        // Function to get favicon URL from a website using DuckDuckGo's service
        function getFaviconUrl(url) {
            try {
                const hostname = new URL(url).hostname;
                return `https://icons.duckduckgo.com/ip3/${hostname}.ico`;
            } catch {
                return null;
            }
        }

        // Update all text content based on language
        function updateLanguage(lang) {
            currentLang = lang;
            
            // Update all elements with data-lang-key attribute
            document.querySelectorAll('[data-lang-key]').forEach(element => {
                const key = element.getAttribute('data-lang-key');
                if (translations[lang][key]) {
                    element.textContent = translations[lang][key];
                }
            });

            // Update language toggle button
            const langToggle = document.getElementById('langToggle');
            langToggle.textContent = lang === 'en' ? 'NL' : 'EN';

            // Re-render projects with new language
            renderProjects();
        }

        // Render projects
        function renderProjects() {
            const container = document.getElementById('projectsContainer');
            container.innerHTML = ''; // Clear existing projects
            
            reversedProjects.forEach(project => {
                const card = document.createElement('div');
                card.className = 'project-card';
                
                const tagsHTML = project.tags.map(tag => `<span class="tag">${tag}</span>`).join('');
                
                const linksHTML = `
                    ${project.github ? `<a href="${project.github}" target="_blank" class="project-link link-github">GitHub</a>` : ''}
                    ${project.demo ? `<a href="${project.demo}" target="_blank" class="project-link link-demo">Demo</a>` : ''}
                `;

                // Get favicon URL or use fallback
                const faviconUrl = project.demo ? getFaviconUrl(project.demo) : null;
                const faviconHTML = faviconUrl 
                    ? `<img src="${faviconUrl}" alt="${project.name}" class="project-favicon" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%233b82f6%22%3E%3Cpath d=%22M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z%22/%3E%3C/svg%3E'">` 
                    : `<img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%233b82f6'%3E%3Cpath d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z'/%3E%3C/svg%3E" alt="Default icon" class="project-favicon">`;
                
                card.innerHTML = `
                    <div class="project-header">
                        ${faviconHTML}
                        <h3 class="project-name">${project.name}</h3>
                    </div>
                    <p class="project-description">${project.description[currentLang]}</p>
                    <div class="project-tags">${tagsHTML}</div>
                    <div class="project-links">${linksHTML}</div>
                `;
                
                container.appendChild(card);
            });
        }

        // Language toggle functionality
        document.getElementById('langToggle').addEventListener('click', () => {
            const newLang = currentLang === 'en' ? 'nl' : 'en';
            updateLanguage(newLang);
        });

        // Initialize
        updateLanguage('en'); // Start with English
    </script>
</body>
</html>
